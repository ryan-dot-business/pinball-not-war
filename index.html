<style>
/* Layout: one full-bleed wooden wall, the printed poster centred on it, sized to fit; nothing else. */
:root{
  --wall:#24130a;      /* wood shadow */
  --field:#EC008C;     /* playfield magenta */
  --target-a:#BA0030;  /* target colour 1 */
  --target-b:#980023;  /* target colour 2 */
  --cream:#FFE6B8;     /* poster stock / flash */
  --ui:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--wall);color:var(--cream)}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#scene{position:fixed;inset:0;overflow:hidden;background:var(--wall)}
#wood{position:absolute;inset:-48px;background:url(wood.jpg) center/cover;filter:brightness(.9) saturate(1.05);will-change:transform}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 60% at 50% 50%,rgba(0,0,0,0) 35%,rgba(0,0,0,.6) 100%)}
#stage{position:absolute;left:50%;top:50%;perspective:1800px}
#tilt{width:100%;height:100%;will-change:transform;box-shadow:0 4px 4px rgba(0,0,0,.25),0 30px 60px -20px rgba(0,0,0,.6)}
#poster{position:absolute;left:0;top:0;width:1110px;height:1954px;transform-origin:0 0;isolation:isolate;overflow:hidden;background:var(--cream)}
.tex{position:absolute;pointer-events:none;background-size:cover;background-position:center}
.paper{mix-blend-mode:multiply;background-image:url(paper.jpg)}
.ink{mix-blend-mode:screen;background-image:url(ink.jpg)}
#pf{position:absolute;left:15px;top:12px;width:1080px;height:1930px;display:block}
.L{transition:fill .45s ease-out}
.L.flash{fill:var(--cream)!important;transition:none}
.ballShape{fill:#fff}
.chrome{position:fixed;z-index:5;font:500 11px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--cream)}
#hint{left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;opacity:.8;transition:opacity .8s;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.6)}
#hint.gone{opacity:0}
#mute{top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,230,184,.45);background:rgba(36,19,10,.55);display:grid;place-items:center;cursor:pointer;padding:0}
#mute:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
#mute svg{width:18px;height:18px;stroke:var(--cream);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#mute .off{display:none}
#mute[aria-pressed="true"] .on{display:none}
#mute[aria-pressed="true"] .off{display:inline}
</style>
</head>

const ORDER = ['P1','I1','N1','B1','A1','L1','L2','N2','O1','T1','W1','A2','R1'];
const ROW = { P1:1, I1:1, N1:1, B1:2, A1:2, L1:2, L2:2, N2:3, O1:3, T1:3, W1:4, A2:4, R1:4 };
const hitCtx = document.createElement('canvas').getContext('2d');
const letters = ORDER.map((k, i) => {
  const el = document.getElementById('letter-' + k);
  const start = el.getAttribute('fill').toUpperCase() === COL_A;
  el.style.fill = start ? COL_A : COL_B;
  const bb = el.getBBox(), pad = R + 8;
  return { k, i, el, row: ROW[k], start, isA: start, path: new Path2D(el.getAttribute('d')),
    x0: bb.x - pad, x1: bb.x + bb.width + pad, y0: bb.y - pad, y1: bb.y + bb.height + pad };

let lettersLocked = true;       // locked during light shows
let celebrating = false;

function flash(L, ms = 110) {
  L.el.classList.add('flash');
  clearTimeout(L.ft);
  L.ft = setTimeout(() => L.el.classList.remove('flash'), ms);
}
function paint(L) { L.el.style.fill = L.isA ? COL_A : COL_B; }
function toggle(i) {

  const L = letters[i];
  L.isA = !L.isA; paint(L); flash(L);
  sfx.ping(i, L.isA);

/* ---------- return paths: rolling surfaces traced from the letter tops ----------
   For each row we rasterise the letters, take the top edge of every column,
   then roll a ball-sized circle over it to get the path of the ball's centre.
   Walking upstream from the exit end, each point is kept a little higher than
   the one after it, which bridges the notches in N and W and any gaps between
   letters, so the ball never settles in a dip. */
const SURF_STEP = 4, MIN_SLOPE = 0.08, CLEAR = R + 3;
const SURFS = buildSurfaces([
  // reach: how far the path runs past the last letter at its entry end (playfield units)
  { row: 2, flow: -1, reach: 10 },    // BALL rolls right → left, stops at the L
  { row: 3, flow:  1, reach: 20 },    // NOT  rolls left → right, ends just past the N's left edge
  { row: 4, flow: -1, reach: 8 },     // WAR  rolls right → left, runs to the R's edge so balls
                                      //      coming off the T fall past it to the right flipper

function buildSurfaces(defs) {
  const S = 0.5, cw = Math.ceil(W * S), ch = Math.ceil(H * S);
  const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
  const c = cv.getContext('2d', { willReadFrequently: true });
  return defs.map(d => {
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, cw, ch);
    c.setTransform(S, 0, 0, S, 0, 0); c.fillStyle = '#000';
    letters.filter(L => L.row === d.row).forEach(L => c.fill(L.path));
    const px = c.getImageData(0, 0, cw, ch).data;
    const top = new Float32Array(cw).fill(Infinity);
    for (let x = 0; x < cw; x++) for (let y = 0; y < ch; y++) if (px[(y * cw + x) * 4 + 3] > 127) { top[x] = y / S; break; }
    const n = Math.floor(W / SURF_STEP) + 1, cy = new Float32Array(n).fill(Infinity);
    for (let i = 0; i < n; i++) {
      const x = i * SURF_STEP; let best = Infinity;
      const a = Math.max(0, Math.ceil((x - CLEAR) * S)), b = Math.min(cw - 1, Math.floor((x + CLEAR) * S));
      for (let p = a; p <= b; p++) {
        const t = top[p]; if (t === Infinity) continue;
        const dx = p / S - x, v = t - Math.sqrt(Math.max(0, CLEAR * CLEAR - dx * dx));
        if (v < best) best = v;
      }
      cy[i] = best;
    }
    let first = 0, last = n - 1;
    while (first < n && cy[first] === Infinity) first++;
    while (last > 0 && cy[last] === Infinity) last--;
    let inkMin = 0, inkMax = cw - 1;
    while (inkMin < cw && top[inkMin] === Infinity) inkMin++;
    while (inkMax > 0 && top[inkMax] === Infinity) inkMax--;
    const up = -d.flow;                       // index step that walks upstream
    let exit = d.flow < 0 ? first : last;
    // trim the steep roll-off at the exit, and keep the exit clear of the wall,
    // so the ball drops off cleanly instead of wedging against the side
    const wallGap = Math.ceil((R + 30) / SURF_STEP);
    while (Math.abs(cy[exit] - cy[exit + up]) / SURF_STEP > 0.8 ||

    for (let i = exit + up; i >= 0 && i < n; i += up) cy[i] = Math.min(cy[i], cy[i - up] - MIN_SLOPE * SURF_STEP);

    const entryX = d.flow < 0 ? inkMax / S + d.reach : inkMin / S - d.reach;
    const entry = Math.max(0, Math.min(n - 1, Math.round(entryX / SURF_STEP)));

}
function surfAt(s, x) {
  const f = x / SURF_STEP, i = Math.floor(f);

// Short feed rails from the side walls onto the flippers (from the Figma return trails)
const SEGS = [

  [149.879, 1587.97, 1, 1561.83],

  const ax = Math.min(x1, x2), ay = ax === x1 ? y1 : y2, bx = Math.max(x1, x2), by = ax === x1 ? y2 : y1;

/* ---------- flippers ---------- */
const flippers = [
  { el: document.getElementById('FL'), px: 118.5, py: 1659.5, c0: [121.64, 1662.30], r0: 69.6, c1: [461.51, 1771.09], r1: 30.9, up: -0.62, a: 0, w: 0, held: false },
  { el: document.getElementById('FR'), px: 965.5, py: 1613.5, c0: [957.36, 1618.37], r0: 69.6, c1: [617.49, 1727.15], r1: 30.9, up: 0.62, a: 0, w: 0, held: false },
];
function stepFlippers(dt) {
  for (const f of flippers) {
    const target = f.held ? f.up : 0, speed = f.held ? 20 : 9, prev = f.a;
    const d = target - f.a; f.a += Math.sign(d) * Math.min(Math.abs(d), speed * dt);

}

/* ---------- balls ---------- */
const ballLayer = document.getElementById('balls');
const balls = [];
function makeBall(x, y, vx = 0, vy = 0) {
  const g = document.createElementNS(SVGNS, 'g');
  const c = document.createElementNS(SVGNS, 'circle'); c.setAttribute('r', R); c.setAttribute('class', 'ballShape');
  g.appendChild(c); ballLayer.appendChild(g);
  const b = { x, y, vx, vy, asc: false, ax: x, grounded: false, launchT: -9, sq: 0, sqA: 0, el: g, touch: new Map(), pop: 0 };
  balls.push(b); return b;
}

function impact(b, v, nx, ny, kind) {
  if (b.sim) return;
  if (v > 220) { b.sq = Math.min(0.22, v / 5500); b.sqA = Math.atan2(ny, nx); }
  if (v > 140 && clock - (impact.t || 0) > 0.06) { impact.t = clock; kind === 'wall' ? sfx.wall(v) : sfx.land(v); }
}

function stepBall(b, dt, t) {
  b.vy += G * dt;
  if (!b.asc) { const drag = 1 - 0.22 * dt; b.vx *= drag; b.vy *= drag; }
  const sp = Math.hypot(b.vx, b.vy); if (sp > 2800) { b.vx *= 2800 / sp; b.vy *= 2800 / sp; }

  // walls
  if (b.x < R) { b.x = R; if (b.vx < 0) { impact(b, -b.vx, 1, 0, 'wall'); b.vx = -b.vx * 0.55; } }   // left wall kicks balls off the B back onto the N

  if (b.y < R) { b.y = R; if (b.vy < 0) { impact(b, -b.vy, 0, 1, 'wall'); b.vy = -b.vy * 0.45; } }

  if (b.asc) return;   // on the way up the ball passes through everything

  // rolling surfaces along the letter tops (one-way: only from above)
  for (const s of SURFS) {
    const r = surfAt(s, b.x); if (!r) continue;
    const d = b.y - r[0]; if (d <= 0 || d > 44) continue;
    const k = r[1], inv = 1 / Math.hypot(1, k), nx = k * inv, ny = -inv;
    const vn = b.vx * nx + b.vy * ny; if (vn >= 0) continue;
    b.y = r[0];
    const e = -vn > 380 ? 0.28 : 0;
    b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny;
    const tx = inv, ty = k * inv, tv = b.vx * tx + b.vy * ty, f = -0.12 * dt;
    b.vx += tx * tv * f; b.vy += ty * tv * f;

  const lim = R + 5.5;

    const rx = b.x - s.ax, ry = b.y - s.ay, u = rx * s.ux + ry * s.uy; if (u < 0 || u > s.len) continue;

    const dx = q1[0] - q0[0], dy = q1[1] - q0[1];

// Cartoon launch: the shot is planned so the ball tops out exactly above a chosen
// landing spot, hangs for a beat, then drops straight down onto the return path.
function launch(b, nx, ny, t) {
  const s = chooseShot();
  const ay = Math.min(s.ay, b.y - 220);
  const vy0 = Math.sqrt(2 * G * (b.y - ay)), tA = vy0 / G;
  b.vy = -vy0; b.vx = (s.xt - b.x) / tA; b.ax = s.xt; b.asc = true; b.launchT = t;
  b.sq = 0.24; b.sqA = Math.atan2(ny, nx);
  sfx.launch();
}

function collideBalls() {
  for (let i = 0; i < balls.length; i++) for (let j = i + 1; j < balls.length; j++) {
    const a = balls[i], b = balls[j]; if (a.asc || b.asc || a.pop || b.pop) continue;
    let nx = b.x - a.x, ny = b.y - a.y; const d = Math.hypot(nx, ny);
    if (d >= 2 * R || d === 0) continue;
    nx /= d; ny /= d; const o = (2 * R - d) / 2;
    a.x -= nx * o; a.y -= ny * o; b.x += nx * o; b.y += ny * o;
    const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny; if (rv >= 0) continue;
    const j2 = -(1 + 0.6) * rv / 2;
    a.vx -= j2 * nx; a.vy -= j2 * ny; b.vx += j2 * nx; b.vy += j2 * ny;
    if (-rv > 200) sfx.clack(-rv);
  }

/* ---------- touching letters ---------- */
const SAMPLES = [[0, 0]];
for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; SAMPLES.push([Math.cos(a) * 0.7, Math.sin(a) * 0.7]); }

function touches(b, t, onEnter) {
  if (b.asc || b.pop) return;
  for (const L of letters) {
    if (b.x < L.x0 || b.x > L.x1 || b.y < L.y0 || b.y > L.y1) continue;
    let hit = false;
    for (const [sx, sy] of SAMPLES) if (hitCtx.isPointInPath(L.path, b.x + sx * R, b.y + sy * R)) { hit = true; break; }
    if (!hit) continue;
    const seen = b.touch.get(L.i);
    if (seen === undefined || t - seen > 0.22) onEnter(L.i);
    b.touch.set(L.i, t);
  }
}

/* ---------- shot planning ----------
   Every possible landing spot is test-dropped once at load to learn which letters
   that run switches. Most launches then pick a run that brings the letters closer
   to all one colour, so the multiball payoff arrives after a handful of flips. */
const SHOTS = [];
function simShot(xt, ay) {
  const b = { x: xt, y: ay, vx: 0, vy: 0, asc: false, ax: xt, launchT: -9, touch: new Map(), sim: true };
  let mask = 0, t = 0, n = 0;
  while (t < 10) {
    stepBall(b, DT, t);
    if (++n % 4 === 0) touches(b, t, i => { mask ^= 1 << i; });
    if (b.y > 1520) break;

  }

}
(function buildShots() {
  const cands = [];
  for (let xt = 110; xt <= 970; xt += 40) {
    cands.push([xt, 95]);
    for (const s of SURFS) { const r = surfAt(s, xt); if (r && r[0] - 110 > 140) cands.push([xt, r[0] - 110]); }
  }
  let ci = 0;

    const t0 = performance.now();
    while (ci < cands.length && performance.now() - t0 < 8) { const r = simShot(...cands[ci++]); if (r.mask) SHOTS.push(r); }
    if (ci < cands.length) setTimeout(chunk, 16);

})();

  if (distFor !== SHOTS.length) buildDist();

  const s = stateBits(), here = DIST[s];

    if (closer.length) pool = closer;

/* ---------- light shows + multiball ---------- */
const later = (ms, fn) => setTimeout(fn, reduceMotion ? 0 : ms);
function chase(step, hold, t0 = 0) {
  letters.forEach((L, i) => later(t0 + i * step, () => flash(L, hold)));
  return t0 + letters.length * step + hold;
}
function openingShow() {
  const end = chase(85, 160, 300);
  [0, 260].forEach(d => later(end + d, () => letters.forEach(L => flash(L, 130))));
  later(end + 400, () => { lettersLocked = false; makeBall(880, 90, -40, 0); sfx.launch(); });
}
let multi = false;          // true from the start of multiball until the table empties
function celebrate() {
  celebrating = true; lettersLocked = true;
  sfx.fanfare();
  let t = chase(60, 120, 150);
  t = chase(60, 120, t);
  for (let k = 0; k < 3; k++) later(t + k * 240, () => letters.forEach(L => flash(L, 140)));
  t += 3 * 240 + 200;
  // back to the opening pattern, one letter at a time
  letters.forEach((L, i) => later(t + i * 85, () => { L.isA = L.start; paint(L); flash(L, 160); sfx.ping(i, L.isA); }));
  t += letters.length * 85 + 300;

  multi = true;
  [[250, 1], [830, -1]].forEach(([x, dir], k) => later(k * 350, () => { makeBall(x, 90, dir * 60, 0); sfx.launch(); }));
}

// dropping in again at the top. Balls resting on the flippers stay put.

    const b = balls[i]; if (!b.gone) continue;
    if (balls.length > 1) { b.el.remove(); balls.splice(i, 1); lost = true; sfx.drain(); }
    else { Object.assign(b, { x: 880, y: 90, vx: -40, vy: 0, asc: false, gone: false, touch: new Map() }); sfx.launch(); }
  }

/* ---------- sound (Web Audio, synthesised) ---------- */

  const note = i => 523.25 * Math.pow(2, SCALE[i % SCALE.length] / 12);
  return {
    init,
    get muted() { return muted; },
    setMuted(m) {
      muted = m; try { localStorage.setItem('pnw-muted', m ? '1' : '0'); } catch (e) {}
      if (master) master.gain.setTargetAtTime(m ? 0 : 0.9, ac.currentTime, 0.02);
    },
    flipUp(side) { if (!ok()) return; const t = ac.currentTime; noise(t, 0.05, 'bandpass', side ? 1150 : 950, 1.4, 0.35); tone(t, 'sine', 150, 55, 0.09, 0.5); },
    flipDown() { if (!ok()) return; noise(ac.currentTime, 0.03, 'bandpass', 700, 2, 0.12); },
    launch() { if (!ok()) return; tone(ac.currentTime, 'triangle', 260, 780, 0.12, 0.16, 0.004); },
    ping(i, hi) {

    },
    land(v) { if (!ok()) return; const t = ac.currentTime; noise(t, 0.035, 'lowpass', 1400, 0.7, Math.min(0.3, v / 2500)); tone(t, 'sine', 120, 90, 0.05, Math.min(0.25, v / 3000)); },
    wall(v) { if (!ok()) return; tone(ac.currentTime, 'sine', 210, 170, 0.06, Math.min(0.2, v / 4000)); },
    clack(v) { if (!ok()) return; const t = ac.currentTime; noise(t, 0.025, 'bandpass', 2400, 3, Math.min(0.25, v / 3000)); tone(t, 'sine', 900, 700, 0.03, Math.min(0.12, v / 6000)); },
    nudge() { if (!ok()) return; const t = ac.currentTime; tone(t, 'sine', 90, 42, 0.18, 0.6, 0.002); noise(t, 0.09, 'lowpass', 380, 0.7, 0.35); },
    drain() { if (!ok()) return; const t = ac.currentTime; tone(t, 'triangle', 520, 130, 0.5, 0.14, 0.01); tone(t + 0.12, 'sine', 260, 70, 0.45, 0.12); },
    pop() { if (!ok()) return; const t = ac.currentTime; tone(t, 'sine', 700, 1400, 0.08, 0.15); tone(t + 0.07, 'sine', 1400, 1900, 0.06, 0.08); },
    fanfare() {
      if (!ok()) return; const t = ac.currentTime;

      const f = note(12); tone(t + 0.68, 'triangle', f, f, 0.9, 0.2); tone(t + 0.68, 'triangle', f * 1.5, f * 1.5, 0.9, 0.1);

    roll(level) { if (!ac) return; rollGain.gain.setTargetAtTime(level, ac.currentTime, 0.06); },
  };
})();

/* ---------- nudge ---------- */
let nudgeT = -9, jolt = 0;
function nudge() {
  if (clock - nudgeT < 0.35) return;
  nudgeT = clock; jolt = 1; sfx.nudge();
  for (const b of balls) {
    if (b.asc || b.pop) continue;
    b.vy -= b.grounded ? 560 : 320;
    b.vx += (Math.random() < 0.5 ? -1 : 1) * (150 + Math.random() * 130);
  }
}

/* ---------- input ---------- */
const hint = document.getElementById('hint');
const coarse = matchMedia('(pointer: coarse)').matches;
const HINT_KEYS = '← → flip · ↑ nudge';
function setHint() {
  if (coarse) hint.textContent = 'tap left · tap right · tap top to nudge';
  else hint.textContent = document.hasFocus() ? HINT_KEYS : 'click the poster, then ← → flip · ↑ nudge';
}
setHint();
addEventListener('focus', setHint); addEventListener('blur', setHint);
try { window.focus(); } catch (e) {}
let hinted = false;
function setFlip(i, down) {
  const f = flippers[i];
  clearTimeout(f.rt);
  if (!down && performance.now() - f.downAt < 110) { f.rt = setTimeout(() => setFlip(i, false), 110 - (performance.now() - f.downAt)); return; }
  if (f.held === down) return;
  f.held = down;
  if (down) f.downAt = performance.now();
  if (down) { sfx.flipUp(i); if (!hinted) { hinted = true; setTimeout(() => hint.classList.add('gone'), 2500); } }
  else sfx.flipDown();
}
const keyMap = { ArrowLeft: [0], KeyA: [0], ShiftLeft: [0], ArrowRight: [1], KeyD: [1], ShiftRight: [1], Space: [0, 1] };
addEventListener('keydown', e => {
  if (e.code === 'KeyM') { sfx.init(); if (!celebrating) celebrate(); return; }   // testing shortcut: start multiball
  if (e.code === 'KeyS') { muteBtn.click(); return; }
  if (e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); sfx.init(); if (!e.repeat) nudge(); return; }
  const m = keyMap[e.code]; if (!m) return;
  e.preventDefault(); sfx.init(); askMotion(); m.forEach(i => setFlip(i, true));
});
addEventListener('keyup', e => { const m = keyMap[e.code]; if (m) { e.preventDefault(); m.forEach(i => setFlip(i, false)); } });
addEventListener('blur', () => flippers.forEach((f, i) => setFlip(i, false)));

const pointers = new Map();
const scene = document.getElementById('scene');
function refreshPointers() { const s = [false, false]; pointers.forEach(v => s[v] = true); s.forEach((d, i) => setFlip(i, d)); }
scene.addEventListener('pointerdown', e => {
  sfx.init(); try { window.focus(); } catch (err) {} setHint();
  if (e.pointerType === 'touch') e.preventDefault();
  if (e.clientY < innerHeight * 0.42) { nudge(); return; }
  pointers.set(e.pointerId, e.clientX < innerWidth / 2 ? 0 : 1);
  try { scene.setPointerCapture(e.pointerId); } catch (err) {}
  refreshPointers();
});
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => scene.addEventListener(t, e => { if (pointers.delete(e.pointerId)) refreshPointers(); }));
scene.addEventListener('contextmenu', e => e.preventDefault());
const onTapEnd = () => { sfx.init(); askMotion(); };
['touchend', 'pointerup', 'click'].forEach(t => addEventListener(t, onTapEnd, { passive: true }));

const muteBtn = document.getElementById('mute');
muteBtn.setAttribute('aria-pressed', String(sfx.muted));
muteBtn.addEventListener('pointerdown', e => e.stopPropagation());
muteBtn.addEventListener('click', () => {
  sfx.init(); const m = !sfx.muted; sfx.setMuted(m);
  muteBtn.setAttribute('aria-pressed', String(m)); muteBtn.setAttribute('aria-label', m ? 'Unmute sound' : 'Mute sound');
});

/* ---------- parallax (gyro on phones, pointer on desktop) ---------- */
const par = { tx: 0, ty: 0, x: 0, y: 0, base: null, gyro: false };
let motionAsked = false;
function askMotion() {
  if (motionAsked) return; motionAsked = true;
  const D = window.DeviceOrientationEvent;
  if (D && typeof D.requestPermission === 'function') D.requestPermission().then(s => { if (s === 'granted') listenGyro(); }).catch(() => { motionAsked = false; });   // retry on the next tap
}
function listenGyro() {
  addEventListener('deviceorientation', e => {
    if (e.beta == null || e.gamma == null) return;
    par.gyro = true;
    if (!par.base) par.base = { b: e.beta, g: e.gamma };
    par.base.b += (e.beta - par.base.b) * 0.004; par.base.g += (e.gamma - par.base.g) * 0.004;
    par.tx = Math.max(-1, Math.min(1, (e.gamma - par.base.g) / 20));
    par.ty = Math.max(-1, Math.min(1, (e.beta - par.base.b) / 20));
  });
}
if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission !== 'function') listenGyro();
addEventListener('pointermove', e => {
  if (par.gyro || e.pointerType !== 'mouse') return;
  par.tx = (e.clientX / innerWidth) * 2 - 1; par.ty = (e.clientY / innerHeight) * 2 - 1;
});
document.addEventListener('mouseleave', () => { if (!par.gyro) { par.tx = 0; par.ty = 0; } });

/* ---------- layout ---------- */
const stage = document.getElementById('stage'), tilt = document.getElementById('tilt'), poster = document.getElementById('poster'), wood = document.getElementById('wood');
function layout() {
  const m = innerWidth < 600 ? 16 : 40;
  const s = Math.min((innerWidth - m * 2) / 1110, (innerHeight - m * 2 - (coarse ? 24 : 16)) / 1954);
  const w = 1110 * s, h = 1954 * s;
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
  stage.style.marginLeft = -w / 2 + 'px'; stage.style.marginTop = -h / 2 - (coarse ? 8 : 0) + 'px';
  poster.style.transform = `scale(${s})`;
}
addEventListener('resize', layout); layout();

/* ---------- render ---------- */
const DEG = 180 / Math.PI;
function render(dt) {
  for (const f of flippers) f.el.setAttribute('transform', `rotate(${(f.a * DEG).toFixed(3)} ${f.px} ${f.py})`);
  let roll = 0;
  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i];
    b.sq *= Math.exp(-13 * dt);
    let k = 1;
    if (b.pop) { b.pop += dt; k = Math.max(0, 1 - b.pop / 0.3); if (k === 0) { b.el.remove(); balls.splice(i, 1); continue; } }
    const a = (b.sqA * DEG).toFixed(2), s = b.sq;
    b.el.setAttribute('transform', `translate(${b.x.toFixed(2)} ${b.y.toFixed(2)}) rotate(${a}) scale(${((1 - s) * k).toFixed(3)} ${((1 + s * 0.6) * k).toFixed(3)}) rotate(${-a})`);
    if (b.grounded) roll = Math.max(roll, Math.min(1, Math.hypot(b.vx, b.vy) / 1100) * 0.1);
  }
  sfx.roll(roll);
  // parallax + nudge jolt
  const m = reduceMotion ? 0 : 1;
  par.x += (par.tx * m - par.x) * Math.min(1, dt * 5); par.y += (par.ty * m - par.y) * Math.min(1, dt * 5);
  jolt *= Math.exp(-9 * dt);
  const jy = -jolt * 14 * Math.cos((1 - jolt) * 9) * m;
  wood.style.transform = `translate3d(${(-par.x * 16).toFixed(2)}px, ${(-par.y * 16).toFixed(2)}px, 0) scale(1.04)`;
  tilt.style.transform = `translate3d(${(par.x * 7).toFixed(2)}px, ${(par.y * 7 + jy).toFixed(2)}px, 0) rotateY(${(par.x * 3.2).toFixed(3)}deg) rotateX(${(-par.y * 3.2 + jolt * 1.5 * m).toFixed(3)}deg)`;
  tilt.style.boxShadow = `${(-par.x * 4).toFixed(1)}px ${(4 - par.y * 3).toFixed(1)}px 4px rgba(0,0,0,.25), ${(-par.x * 22).toFixed(1)}px ${(30 - par.y * 16).toFixed(1)}px 60px -20px rgba(0,0,0,.6)`;
}

/* ---------- loop ---------- */
let last = performance.now(), acc = 0, stepN = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; acc += dt;
  while (acc >= DT) {
    stepFlippers(DT);
    for (const b of balls) if (!b.pop && !b.gone) stepBall(b, DT, clock);
    collideBalls();
    if (++stepN % 4 === 0) for (const b of balls) touches(b, clock, toggle);
    drainCheck();
    clock += DT; acc -= DT;
  }
  render(dt);
  requestAnimationFrame(frame);
}
window.__pnw = { buildDist, get DIST() { return DIST; }, balls, flippers, letters, setFlip, nudge, SURFS, SHOTS, chooseShot, stateBits, oddOnes, celebrate, get clock() { return clock; } };
openingShow();
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
})();
</script>
